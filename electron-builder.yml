appId: me.saino.browser-space.app
productName: Browser Space
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{biome.json,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}"
asarUnpack:
  - resources/**
# Electron fuses: switches in the executable that close ways to misuse a signed, installed app.
# They are applied when the app is packaged, so `pnpm dev` is not affected. Chromium's DevTools
# (F12, Inspect) is not one of them and keeps working.
electronFuses:
  # ELECTRON_RUN_AS_NODE=1 would turn the app into a plain Node.js (the app does not fork)
  runAsNode: false
  # NODE_OPTIONS and NODE_EXTRA_CA_CERTS injected into the main process from the environment
  enableNodeOptionsEnvironmentVariable: false
  # --inspect / --inspect-brk and SIGUSR1: a debugger on the main process
  enableNodeCliInspectArguments: false
  # Load the app only from app.asar, never from a loose app/ folder placed beside it
  onlyLoadAppFromAsar: true
win:
  executableName: browser-space
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSUserNotificationAlertStyle: alert
  notarize: true
  # productName にスペースがあると、GitHub が zip のファイル名をドットに変換して
  # latest-mac.yml の url(ハイフン)と食い違い、自動更新が 404 になる。スペースを含まない名前にする
  artifactName: ${name}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - universal
    # electron-updater (MacUpdater) は zip がないと更新できない
    - target: zip
      arch:
        - universal
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: kaishuu0123
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: kaishuu0123
  repo: browser-space
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
